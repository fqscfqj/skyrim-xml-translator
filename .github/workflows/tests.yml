name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  QT_QPA_PLATFORM: offscreen

jobs:
  pytest:
    name: pytest (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Byte-compile sources
        shell: pwsh
        run: python -m compileall -q src main.py

      - name: Validate locale key parity
        shell: pwsh
        run: python -c "import json,pathlib; en=json.loads(pathlib.Path('locales/en.json').read_text(encoding='utf-8')); zh=json.loads(pathlib.Path('locales/zh.json').read_text(encoding='utf-8')); missing=sorted(set(en)-set(zh)); extra=sorted(set(zh)-set(en)); print('en',len(en),'zh',len(zh)); assert not missing and not extra, (missing[:10], extra[:10])"

      - name: Run test suite
        shell: pwsh
        run: python -m pytest tests -q --durations=10
